<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connections</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body data-app="status" data-root="..">
<main class="page">
  <div class="page-head">
    <div><div class="eyebrow">Platform</div><h1>Connections</h1><p class="lede">What the apps can reach right now.</p></div>
  </div>
  <div class="panel"><div class="table-wrap"><table id="s"><tr><td><span class="spin"></span> checking</td></tr></table></div></div>
</main>
<script src="../shell.js"></script>
<script>
const { esc, call } = window.studio
call('api').then((s) => {
  document.getElementById('s').innerHTML = '<tr><th>Service</th><th>State</th><th>Detail</th></tr>' + Object.entries(s).map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td><span class="tag ${v.ok ? 'green' : 'red'}">${v.ok ? 'ok' : 'failed'}</span></td><td>${esc(v.detail)}</td></tr>`).join('')
})
</script>
</body>
</html>
