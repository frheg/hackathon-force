[project]
name = "hackathon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "duckdb>=1.4",
    "pandas>=2.3",
    "pyarrow>=21",
    "numpy>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
