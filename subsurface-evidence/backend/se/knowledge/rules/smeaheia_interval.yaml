id: smeaheia-interval-scenario
source: https://github.com/jeham3408/natures-plug/blob/3df7c523f9469756aeb8910c2be01456ddda7df8/js/engine.js
target: Overburden above the exact reported Sognefjord top, under an illustrative gas-column load. Not a CO2 injection scenario.
parameters:
  resistivity_max_ohm_m: 1.3
  gamma_min_api: 40
  sonic_min_us_ft: 135
  gas_g_cm3: 0.2
  overbalance_g_cm3: 0.05
  pressure_floor_g_cm3: 1.03
  continuous_m: 30
  longer_run_m: 50
  group_total_m: 50
  log_tolerance_m: 0.15
groups: {HORDALAND GP: 67, ROGALAND GP: 131}
rock: Use the one original FORCE training row nearest each whole 1 m MD bin centre, within 0.15 m. Do not mix curves from different rows. Require all three curves; also replay allowing missing sonic. A measured sonic below threshold never qualifies.
pressure: "Use TVD below rig floor throughout (sampled TVDSS + registry RKB). Reservoir proxy pp = max(floor, interpolated mud weight at top minus overbalance). Required EMW = gas + (pp - gas) * reservoir_TVD / candidate_TVD. Compare to LOT equivalent density interpolated in TVD between adjacent positioned LOT shoes above the reservoir, never beyond either shoe. Not a measured pressure at the candidate."
length: Count adjoining whole MD bins only. A missing bin breaks the run. Require rock and pressure at the selected log depth; net metres alone never establish a candidate. Group context instead sums whole bins within reported group intervals using pressure at bin centres; no rock signature required.
limits: The gas gradient and thresholds are inherited hypotheses. No FIT substituted for a LOT, extrapolated mud, assumed vertical path, inherited neighbour, integrity probability or change to marker evidence. A qualifying run is only a target for further inspection.
check: Replay the pinned raw sources. Compare strict, optional-sonic and zero-overbalance scenarios on the same well. These are assumption sensitivities, not validation against barrier outcomes.
